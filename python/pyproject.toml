# Settings for the lab's Python tools: pytest, ruff and ty. The lab's
# own package, jdclab, lives in lib/, and will be described here too
# once it's installed into the venv (see docs/MAINTAINING.md).

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests import the lab's packages from lib/ without needing PYTHONPATH,
# so they also run where direnv doesn't, such as inside an editor.
pythonpath = ["lib"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# The defaults (pyflakes and the pycodestyle errors), plus import order
# (I), newer syntax where the target allows it (UP) and likely bugs (B).
extend-select = ["I", "UP", "B"]

[tool.ruff.lint.isort]
# The lab's own packages, in lib/: imported after third-party ones.
known-first-party = ["jdclab"]

[tool.ty.environment]
# The venv, at the lab's root, and the lab's packages in lib/, so ty finds
# both without direnv or flags.
python = "../.venv"
extra-paths = ["lib"]
